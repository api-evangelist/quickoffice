name: Quickoffice
description: >-
  Quickoffice was a mobile office productivity suite (document, spreadsheet, and
  presentation editing for iOS, Android, and Symbian) that was acquired by Google in
  June 2012, folded into Google Docs / Google Drive, and formally discontinued in
  2014. It was surfaced as a portfolio company of Mayfield and added to the API
  Evangelist network for enrichment. Enrichment on 2026-07-20 confirmed there is no
  independent Quickoffice API surface. The quickoffice.com domain now resolves to
  Google infrastructure and www.quickoffice.com 301-redirects to
  google.com/docs/about/, developer.quickoffice.com does not resolve (NXDOMAIN), and
  no developer portal, documentation, or API remains. The product capabilities live
  on inside Google Workspace (Google Docs, Sheets, and Slides).
